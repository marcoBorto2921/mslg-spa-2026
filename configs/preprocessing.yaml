# configs/preprocessing.yaml
# MSL preprocessing experiment — extends baseline, does NOT modify it.
#
# Usage:
#   python scripts/train.py --config configs/preprocessing.yaml --subtask mslg2spa
#
# Changes vs baseline:
#   - preprocessing.enabled = true
#   - preprocessing.hyphen_special_token = true
#   - output_dir = checkpoints/preprocessing  (separate from baseline)

model:
  name: "facebook/mbart-large-50"
  max_source_length: 128
  max_target_length: 128

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1

data:
  train_file: "data/raw/MSLG_SPA_train.txt"
  test_mslg2spa: "data/raw/test_mslg2spa.tsv"
  test_spa2mslg: "data/raw/test_spa2mslg.tsv"
  processed_dir: "data/processed/"
  val_split: 0.15

preprocessing:
  enabled: true
  hyphen_special_token: true

training:
  output_dir: "checkpoints/preprocessing"
  num_train_epochs: 30
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  learning_rate: 5.0e-4
  warmup_steps: 50
  weight_decay: 0.01
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "chrf"
  greater_is_better: true
  fp16: True
  seed: 42

generation:
  num_beams: 5
  max_new_tokens: 128

logging:
  report_to: "none"
  logging_steps: 10
